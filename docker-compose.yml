services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reader
      POSTGRES_PASSWORD: reader
      POSTGRES_DB: reader
    ports:
      - "5432:5432"
    volumes:
      - reader_pg:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reader
      MINIO_ROOT_PASSWORD: reader-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - reader_minio:/data

volumes:
  reader_pg:
  reader_minio:
