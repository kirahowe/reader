# The evals app (ADR 0006): a second Fly app, same Neon DB as the reader. Built
# from Dockerfile.eval (a superset image), deployed with `bb deploy:eval`.
app = "kirahowe-reader-evals"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile.eval"

# No [deploy] release_command: the eval migrator applies eval_* migrations on
# boot against its own tracking table (the reader app owns the public schema and
# migrates it from its own deploy).

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    # Margin for JVM cold start (+ eval_* migrate-on-boot).
    grace_period = "20s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # Matches the reader: JVM headroom for metaspace + code cache. Scale to zero.
  memory = "1gb"
