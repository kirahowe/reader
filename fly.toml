app = "kirahowe-reader"
primary_region = "yyz"

[build]

# Applies pending migrations once per deploy in a throwaway machine before
# any app machine boots. A failed migration fails the deploy. Fly runs this as
# the image ENTRYPOINT + release_command (replacing CMD), so this is just the
# main + arg — the JVM prefix lives in the Dockerfile ENTRYPOINT.
[deploy]
  release_command = "reader.migrate prod.edn"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    # Margin for JVM cold start.
    grace_period = "20s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
